services:

  postgres:
    image: postgres:16-alpine
    container_name: drive-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-drivedb}
      POSTGRES_USER: ${DB_USER:-driveuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-drivepass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-driveuser} -d ${DB_NAME:-drivedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: drive-rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drive-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: hashhari/gdriveclone-backend:${IMAGE_TAG:-1.0.0}
    container_name: drive-backend
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-drivedb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-driveuser}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-drivepass}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      STORAGE_TYPE: local
      STORAGE_LOCAL_DIRECTORY: /app/data/storage

      JWT_SECRET: ${JWT_SECRET:-change-this-secret}

    volumes:
      - storage-data:/app/data/storage

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: hashhari/gdriveclone-frontend:${IMAGE_TAG:-1.0.0}
    container_name: drive-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage-data:
