spring.application.name=PersonalDrive

# Database (PostgreSQL from Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/drive
spring.datasource.username=drive
spring.datasource.password=localdev

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Storage Selection (local or r2)
storage.type=local
storage.local.directory=./data/storage

# Observability (Actuator, Prometheus, Tracing)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0

# Resilience4j Circuit Breaker Config for R2
resilience4j.circuitbreaker.instances.r2Storage.slidingWindowSize=10
resilience4j.circuitbreaker.instances.r2Storage.failureRateThreshold=50
resilience4j.circuitbreaker.instances.r2Storage.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.r2Storage.permittedNumberOfCallsInHalfOpenState=3

# R2 Configuration (Placeholders)
r2.account-id=
r2.access-key=
r2.secret-key=
security.master.key=eThWmZq4t7w!z%C*F-JaNdRgUjXn2r5u

# Redis Configuration for Caching
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

