spring.application.name=PersonalDrive

# Database (PostgreSQL with env override for DEV/QA/PROD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drivedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:driveuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:drivepass}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ Event Messaging
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Storage Selection - LOCAL STORAGE ONLY (Default & Recommended)
storage.type=${STORAGE_TYPE:local}
storage.local.directory=${STORAGE_LOCAL_DIRECTORY:./data/storage}

# Observability (Actuator, Prometheus, Metrics)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0

# Security & Master Key
security.master.key=${SECURITY_MASTER_KEY:eThWmZq4t7w!z%C*F-JaNdRgUjXn2r5u}
jwt.secret=${JWT_SECRET:eThWmZq4t7w!z%C*F-JaNdRgUjXn2r5ueThWmZq4t7w!z%C*F-JaNdRgUjXn2r5u}

# Redis Configuration for Caching
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
