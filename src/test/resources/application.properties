# Test Configuration - Runs in-memory without external infrastructure
spring.application.name=PersonalDriveTest

# In-memory H2 Database for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Storage Configuration (Local Storage Only)
storage.type=local
storage.local.directory=./target/test-storage

# Disable external messaging & caching in tests
spring.rabbitmq.listener.simple.auto-startup=false
spring.cache.type=none

